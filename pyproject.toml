[project]
name = "serverless-webhook-ingestion"
version = "0.1.0"
description = "Serverless ingestion platform for third-party vendor webhooks, defined in Terraform and verified against an AWS emulator"
readme = "README.md"
license = "MIT"
authors = [{ name = "Linus Dominic Nathaniel" }]
requires-python = ">=3.12,<3.13"
# The Lambda runtime provides boto3. The deployment packages add nothing to it except
# pyarrow in the compactor (see the lambda-compactor group and scripts/build_lambdas.py).
dependencies = []

[dependency-groups]
# Shipped inside compactor.zip. The build script installs exactly this group for the
# target architecture, so the lock file decides what goes into the package.
lambda-compactor = ["pyarrow==26.0.1"]
dev = [
    { include-group = "lambda-compactor" },
    "boto3>=1.43,<2",
    "requests>=2.32,<3",
    "pytest>=9,<10",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5.1,<6",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-requests>=2.32",
    "pre-commit>=4",
    "duckdb>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_platform", "src/webhook_tools"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --strict-markers"
markers = ["integration: needs the emulator running and the stack deployed (make up deploy)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", ".run"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT"]
ignore = [
    "S101", # assert is how pytest and the verifier's internal checks work
    "S311", # random is used for seeded, reproducible test data, never for secrets
    "UP017", # timezone.utc reads the same on every supported version
    "UP042", # (str, Enum) keeps .value comparisons and JSON output explicit
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105", "S106", "S108", # fixture credentials and paths
    "PT018",  # one assertion per behaviour reads better here than one per comparison
    "RUF001", # deliberately odd characters in malformed-input cases
]
"src/webhook_tools/**" = ["S105", "S106", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/webhook_platform"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true
follow_untyped_imports = false
